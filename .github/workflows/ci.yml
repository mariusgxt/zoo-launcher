name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # A release can also be cut by hand; it tags the commit it runs on.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  GOOSE_REF: v2026.3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            goose: goose/build/goose
            exe: zoo-launcher
            client: zoo-client
          - os: windows-2022
            name: windows-x64
            goose: goose/build/Release/goose.exe
            exe: zoo-launcher.exe
            client: zoo-client.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxtst-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libgl-dev libvulkan-dev mesa-vulkan-drivers

      - name: Cache the Goose compiler
        id: goose-cache
        uses: actions/cache@v4
        with:
          path: goose
          key: goose-${{ env.GOOSE_REF }}-${{ matrix.name }}-1

      - name: Build the Goose compiler
        shell: bash
        run: |
          if [ ! -f "${{ matrix.goose }}" ]; then
            rm -rf goose
            git clone --depth 1 --branch "$GOOSE_REF" https://github.com/aardappel/goose goose
            cmake -S goose -B goose/build -DCMAKE_BUILD_TYPE=Release -DGOOSE_BUILTIN_LIBS=all
            cmake --build goose/build --config Release --parallel
          fi

      - name: Build zoo
        shell: bash
        run: |
          ./${{ matrix.goose }} build zoo.goose
          ./${{ matrix.goose }} build client.goose

      - name: Test
        shell: bash
        run: |
          (cd test/data && python -m http.server 8765 &)
          sleep 2
          ./${{ matrix.goose }} tests.goose

      # Draws the test world with the stand-in resources and keeps the frame,
      # which catches a broken mesh or shader that the unit tests cannot see.
      - name: Render the test world
        shell: bash
        env:
          GOOSE_GFX_HEADLESS: "1"
        run: ./${{ matrix.client }} --saves test/data --resources test/data/resources --at 8 26 8 --radius 1 --frames 2

      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.name }}
          path: zoo-client.png

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/zoo
          cp ${{ matrix.exe }} ${{ matrix.client }} README.md THIRD_PARTY_NOTICES.md dist/zoo/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../zoo-${{ matrix.name }}.zip zoo >/dev/null; else tar czf ../zoo-${{ matrix.name }}.tar.gz zoo; fi

      - uses: actions/upload-artifact@v4
        with:
          name: zoo-${{ matrix.name }}
          path: zoo-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the specimen label
        run: |
          ref="${{ github.event.inputs.release_tag || github.ref_name }}"
          tag="${ref#v}"
          {
            echo "## zoo ${tag}"
            echo
            grep -A7 "version: \"${tag}\"" zoo/specimen.goose | sed -n 's/^ *\([a-z]*\): "\(.*\)",$/- **\1**: \2/p'
            echo
            echo "Unpack the archive for your system and start \`zoo-launcher\`."
            echo
            echo "\`zoo-client\` opens a world of your own and draws it; see the README."
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
